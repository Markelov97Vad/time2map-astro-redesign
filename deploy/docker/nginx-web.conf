# In-container nginx: static site + reverse-proxy for the contact API.
# Host nginx/certbot terminates TLS and proxies the whole site to :8080.
#
# absolute_redirect off — otherwise directory slash redirects become
# Location: http://host/... (scheme of the Docker hop), and host HTTP→HTTPS
# creates ERR_TOO_MANY_REDIRECTS.

upstream time2map_app {
    server app:4322;
}

server {
    listen 80;
    server_name _;

    absolute_redirect off;
    port_in_redirect off;

    # Text assets are served compressed (the host nginx only gzips text/html).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Baseline security headers incl. HSTS (the host proxy passes them through; CSP is a separate task).
    # nginx add_header does not inherit into locations that set their own headers,
    # so the asset locations below include the same snippet.
    include /etc/nginx/snippets/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    # Contact form only — Keystatic/admin/publish are not exposed in Docker prod
    # (content ships via git → CI image rebuild).
    location = /api/contact {
        proxy_pass http://time2map_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Fingerprinted build output: cache forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Images keep their names when replaced, so no "immutable" here.
    location /images/ {
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        rewrite ^/(.+)/$ /$1 permanent;
        # =404 keeps the real 404 status (error_page below serves 404.html as the body);
        # falling back to /404.html directly would answer 200 — a soft 404 for search engines.
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
