# Included by nginx-web.conf at server level and in every location that sets its own
# headers (add_header is not inherited once a location declares one).
# HSTS: browsers that saw this header use https only for time2map.com and all subdomains
# for a year. Every subdomain must keep serving https (route.*, catalunya-crimes.* do).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
