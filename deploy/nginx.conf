# time2map.com — TLS terminator in front of Docker Compose.
# Install: copy to /etc/nginx/sites-available/time2map, symlink into
# sites-enabled/, then run `certbot --nginx -d time2map.com -d www.time2map.com`
# (certbot manages the TLS cert lines and the HTTP->HTTPS redirect).
#
# Docker publishes the site on 127.0.0.1:8080 (web nginx + contact API proxy).

upstream time2map_docker {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name time2map.com www.time2map.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name time2map.com www.time2map.com;

    # ssl_certificate / ssl_certificate_key are added by certbot.

    location / {
        proxy_pass http://time2map_docker;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        # Safety if an old web image still emits absolute http:// Location headers.
        proxy_redirect http://$host/ https://$host/;
        proxy_redirect http://$host:80/ https://$host/;
    }
}
