services:
  heading: What we do?
  groups:
    - title: Maps & GIS Solutions
      items:
        - Custom interactive maps with Mapbox/Maplibre, Leaflet
        - Geospatial analysis & visualization (QGIS, ArcGIS, GDAL, FME)
        - Mobile Offline maps
        - 3D maps with Cesium / terrain models
        - Tile servers, spatial databases (GDB, PostGIS, Geoserver, QGIS Server, Titiler)
        - CAD ↔︎ GIS (FME, GDAL)
        - Web cartography with Mapbox Studio
        - Geodata preprocessing, digitizing
    - title: Full-Stack Web Development
      items:
        - UX / UI Design with Figma, prototyping and responsive design
        - Business + System Analysis
        - Frontend development with popular frameworks (React / Vue / Angular)
        - Backend development with Python / Java
        - 'Quality Assurance: auto / manual tests'
        - Software Architecture
        - CI/CD & cloud deployment
        - High-load

