about:
  heading: Meet Alex
  quote: >-
    I lead every project personally and bring in trusted specialists when the
    scope demands it
  badges:
    - icon: /images/icons/top-rated-plus.svg
      text: Top Rated Plus on Upwork
    - icon: /images/icons/job-success.svg
      text: 100% Job Success on Upwork

process:
  heading: How We Work?
  intro: We designed our process to make it easy to get started and build trust early on.
  steps:
    - title: 40-min FREE consultation
      text: >-
        We'll listen to your needs, suggest the best approach and technologies,
        and answer all your questions.

        By the end of the call, you'll know exactly how we can help.
      showBookButton: true
    - title: 7-days trial
      text: >-
        Start working with us for 7 days without commitment. Test our
        communication, skills, and workflows.

        If you're satisfied, we'll include these 7 days in the project contract.
      showBookButton: false
    - title: Kickoff & roadmap
      text: >-
        We prepare a clear roadmap with milestones, delivery timelines, and
        responsibilities. Together we decide the best collaboration model:

        ✔︎ **Fixed-price** for well-defined scopes

        ✔︎ **Time & Material** for flexible, evolving projects

        ✔︎ **Hybrid** a mix of both, tailored to your needs
      showBookButton: false
    - title: Delivery & support
      text: >-
        We deliver high-quality solutions on time and provide ongoing support
        if needed.

        From deployment to maintenance, you're covered.
      showBookButton: false

